# NOTES:
## All variable values should be enclosed within double quotes: "<value>"
## CONFIGURATION FILE for `gm2xpkg` script version:
PKGVER="0.9"

# EXEC commands (set to "1" anyone for desired outcome), you can instead use [OPTIONS] of `gm2xpkg`:
PACKAGE=""
ZIP=""
IPK="1"
CLEAN="1"

# VERBOSE mode (insert "yes" to have more info)
VERBOSE=""

# ENV VAR.
## Specific (mandatory to provide!)
TARGET="quake"  # [filepath], replace with target's working binary path (<path>/<file_name>)
VERSION="m2"  # [string], replace with correct release version if exist of target binary

## Link entries (better modify if no <target_name>.lnk file provided)
### Primary
TITLE="Quake" # [string], program title
DESCRI="TyrQuake with SDL" # [string], short description
DESTDIR="games" # [string], (default="apps") installation pathname in target device $HOMEPATH directory - not a link entry
SECTION="games" # [string], (default="applications") section in menu
### Additional
PARAMS="/roms/QUAKE_1/id1" # [string], parameters (options; args) being passed to execution cmd

## Custom entries (if needed then modify)
DOCS=("COPYRIGHT") # [array] of filepaths to extra text files e.g. =("docs/LICENSE" "CHANGELOG" "CONTRIBUTORS") which will be copied & converted to *.txt files for ease of use by frontend and placed in $TARGET_DIR

## IPK control entries (if needed then modify)
MAINTAINER="Apaczer"
# CONTROL= # automated output of *.ipk control config file
DEPENDS="sdl" # list of dependency packages e.g. ="sdl, libpng" or ="sdl (>= 2.9.2), sdl_mixer (= ed76d39cda0735d26c14a3e4f4da996e420f6478)" provide only for shared libs build, otherwise ignored (run "readelf -d $TARGET | grep NEEDED" to bisect)
SOURCE="https://github.com/Apaczer/sdlquake"
LICENSE="GPL-2"
